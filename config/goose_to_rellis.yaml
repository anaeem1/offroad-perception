7: 10    # bikeway
9: 10    # pedestrian_crossing
11: 10   # road_marking
3: 23    # cobble
21: 23   # sidewalk
22: 23   # curb (a low step; concrete costs it as artificial ground, the height check catches tall curbs)
# natural ground
24: 1    # gravel: drivable loose ground, closest to dirt
31: 1    # soil
5: 1     # leaves (on the ground)
2: 1     # snow: no RELLIS class; treated as dirt
