# GOOSE class (label_key, goose-dataset.de challenge_label_mapping.csv) -> RELLIS-3D ontology id, so that the
# second benchmark runs through the same cost table, grid, fusion and evaluation code as RELLIS-3D.
# RELLIS ontology ids used by the pipeline: 0 void, 1 dirt, 3 grass, 4 tree, 5 pole, 6 water, 7 sky, 8 vehicle,
# 9 object, 10 asphalt, 12 building, 15 log, 17 person, 18 fence, 19 bush, 23 concrete, 27 barrier, 31 puddle,
# 33 mud, 34 rubble. Judgement calls are commented; the conservative choice (lethal) wins when unsure.
0: 0     # undefined
56: 0    # outlier
8: 0     # ego_vehicle (removed by the ego box anyway)
# artificial structures
38: 12   # building
39: 12   # wall
43: 12   # bridge
44: 12   # tunnel
